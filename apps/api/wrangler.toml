name = "homeinstgeorgeutah-api"
main = "src/index.ts"
compatibility_date = "2026-05-28"
account_id = "5c2c50cd82516e7f000aac929d48c0d2"

routes = [
  { pattern = "homeinstgeorgeutah.com/api/*", zone_name = "homeinstgeorgeutah.com" },
  { pattern = "www.homeinstgeorgeutah.com/api/*", zone_name = "homeinstgeorgeutah.com" }
]

[observability]
enabled = true

[vars]
APP_ENV = "production"
SITE_URL = "https://homeinstgeorgeutah.com"
MLS_PROVIDER_NAME = "Washington County listing feed"
MLS_ACTIVATION_ENABLED = "false"
MLS_POLICY_VERSION = ""
LISTING_PROVIDER = ""
SPARK_API_BASE_URL = ""
API_WRITE_ORIGINS = "https://homeinstgeorgeutah.com,https://www.homeinstgeorgeutah.com"

# Required secrets after credentials are issued:
# bunx wrangler secret put SPARK_ACCESS_TOKEN --config apps/api/wrangler.toml
# bunx wrangler secret put TURNSTILE_SECRET_KEY --config apps/api/wrangler.toml
#
# Do not commit live tokens, API keys, session secrets, or MLS credentials.

[[ratelimits]]
name = "LEAD_RATE_LIMITER"
namespace_id = "7731220"

  [ratelimits.simple]
  limit = 5
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "homeinstgeorgeutah"
database_id = "8ca08d07-6614-4533-b7eb-3c92db623282"
migrations_dir = "../../packages/db/migrations"
