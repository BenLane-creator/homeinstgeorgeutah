name = "homeinstgeorgeutah-api"
main = "src/worker.ts"
compatibility_date = "2026-05-28"
account_id = "5c2c50cd82516e7f000aac929d48c0d2"

routes = [
  { pattern = "homeinstgeorgeutah.com/api/*", zone_name = "homeinstgeorgeutah.com" },
  { pattern = "www.homeinstgeorgeutah.com/api/*", zone_name = "homeinstgeorgeutah.com" }
]

[observability]
enabled = true

[triggers]
# Safe while MLS gates are pending: source sync records a skipped run and never
# contacts an MLS provider until that county's full activation contract passes.
crons = ["*/5 * * * *"]

[vars]
APP_ENV = "production"
SITE_URL = "https://homeinstgeorgeutah.com"
API_WRITE_ORIGINS = "https://homeinstgeorgeutah.com,https://www.homeinstgeorgeutah.com"
OWNER_NOTIFICATION_EMAIL = "joel@homeinstgeorgeutah.com"
EMAIL_DELIVERY_WEBHOOK_URL = ""
ACCOUNT_SESSION_TTL_SECONDS = "1209600"

# Four independent MLS approval and activation scopes. Pending status is
# informational only; no live data path activates until every county/role gate passes.
WASHINGTON_IDX_APPROVAL_STATUS = "pending"
WASHINGTON_IDX_ENABLED = "false"
WASHINGTON_IDX_POLICY_VERSION = ""
WASHINGTON_IDX_PROVIDER = ""
WASHINGTON_IDX_API_BASE_URL = ""

WASHINGTON_VOW_APPROVAL_STATUS = "pending"
WASHINGTON_VOW_ENABLED = "false"
WASHINGTON_VOW_POLICY_VERSION = ""
WASHINGTON_VOW_CLIENT_ID = ""
WASHINGTON_VOW_AUTHORIZATION_URL = ""
WASHINGTON_VOW_TOKEN_URL = ""
WASHINGTON_VOW_ISSUER = ""
WASHINGTON_VOW_JWKS_URL = ""
WASHINGTON_VOW_USERINFO_URL = ""
WASHINGTON_VOW_SCOPES = "openid profile email"
WASHINGTON_VOW_TOKEN_AUTH_METHOD = "client_secret_post"
WASHINGTON_VOW_MLS_ID = ""

IRON_IDX_APPROVAL_STATUS = "pending"
IRON_IDX_ENABLED = "false"
IRON_IDX_POLICY_VERSION = ""
IRON_IDX_PROVIDER = ""
IRON_IDX_API_BASE_URL = ""

IRON_VOW_APPROVAL_STATUS = "pending"
IRON_VOW_ENABLED = "false"
IRON_VOW_POLICY_VERSION = ""
IRON_VOW_CLIENT_ID = ""
IRON_VOW_AUTHORIZATION_URL = ""
IRON_VOW_TOKEN_URL = ""
IRON_VOW_ISSUER = ""
IRON_VOW_JWKS_URL = ""
IRON_VOW_USERINFO_URL = ""
IRON_VOW_SCOPES = "openid profile email"
IRON_VOW_TOKEN_AUTH_METHOD = "client_secret_post"
IRON_VOW_MLS_ID = ""

VOW_REDIRECT_URI = "https://homeinstgeorgeutah.com/api/v1/auth/flexmls/callback"

# Required secrets only after the corresponding approval and credentials are issued:
# bunx wrangler secret put WASHINGTON_IDX_ACCESS_TOKEN --config apps/api/wrangler.toml
# bunx wrangler secret put WASHINGTON_VOW_CLIENT_SECRET --config apps/api/wrangler.toml
# bunx wrangler secret put IRON_IDX_ACCESS_TOKEN --config apps/api/wrangler.toml
# bunx wrangler secret put IRON_VOW_CLIENT_SECRET --config apps/api/wrangler.toml
# bunx wrangler secret put VOW_STATE_SECRET --config apps/api/wrangler.toml
# bunx wrangler secret put VOW_TOKEN_ENCRYPTION_SECRET --config apps/api/wrangler.toml
# bunx wrangler secret put TURNSTILE_SECRET_KEY --config apps/api/wrangler.toml
# bunx wrangler secret put INTERNAL_JOB_TOKEN --config apps/api/wrangler.toml
# bunx wrangler secret put EMAIL_DELIVERY_TOKEN --config apps/api/wrangler.toml
#
# Do not commit live tokens, API keys, client secrets, state secrets, or MLS credentials.

[[ratelimits]]
name = "LEAD_RATE_LIMITER"
namespace_id = "7731220"

  [ratelimits.simple]
  limit = 5
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "homeinstgeorgeutah"
database_id = "8ca08d07-6614-4533-b7eb-3c92db623282"
migrations_dir = "../../packages/db/migrations"
