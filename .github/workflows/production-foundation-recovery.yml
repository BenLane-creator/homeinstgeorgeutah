name: Recover and verify production foundation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-foundation-recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-foundation-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Reassert exact release and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      TARGET_SHA: e50997b7c581af3ce2a4a5fecf825b37c3f1c772
      PAGES_PROJECT: homeinstgeorgeutah-cloudflare
      PRODUCTION_BRANCH: main
      WORKER_NAME: homeinstgeorgeutah-api
      WORKER_CONFIG: apps/api/wrangler.toml
      D1_DATABASE: homeinstgeorgeutah
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out exact approved release
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies and build site
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build:site
          mkdir -p recovery-evidence

      - name: Validate Cloudflare project and protected configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERNAL_JOB_TOKEN: ${{ secrets.INTERNAL_JOB_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID INTERNAL_JOB_TOKEN TURNSTILE_SECRET_KEY; do
            test -n "${!required:-}" || { echo "::error::Missing ${required}."; exit 1; }
          done
          bunx wrangler --version | grep -F "4.113.0"
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$project_url" > recovery-evidence/pages-project.json
          PAGES_PROJECT="$PAGES_PROJECT" PRODUCTION_BRANCH="$PRODUCTION_BRANCH" jq -e '
            .success == true and
            .result.name == env.PAGES_PROJECT and
            .result.production_branch == env.PRODUCTION_BRANCH
          ' recovery-evidence/pages-project.json > /dev/null

      - name: Reassert exact Worker and Pages release
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERNAL_JOB_TOKEN: ${{ secrets.INTERNAL_JOB_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          worker_secrets="$RUNNER_TEMP/homeinstgeorgeutah-worker-secrets.json"
          trap 'rm -f "$worker_secrets"' EXIT
          jq -n \
            --arg internalJobToken "$INTERNAL_JOB_TOKEN" \
            --arg turnstileSecretKey "$TURNSTILE_SECRET_KEY" \
            '{INTERNAL_JOB_TOKEN: $internalJobToken, TURNSTILE_SECRET_KEY: $turnstileSecretKey}' \
            > "$worker_secrets"
          chmod 600 "$worker_secrets"

          WRANGLER_OUTPUT_FILE_PATH=recovery-evidence/worker-deploy.ndjson \
            bunx wrangler deploy --config "$WORKER_CONFIG" --strict \
              --secrets-file "$worker_secrets" \
              --tag "$TARGET_SHA" \
              --message "foundation-recovery release-sha:$TARGET_SHA"

          WRANGLER_OUTPUT_FILE_PATH=recovery-evidence/pages-deploy.ndjson \
            bunx wrangler pages deploy apps/site/dist \
              --project-name "$PAGES_PROJECT" \
              --branch "$PRODUCTION_BRANCH" \
              --commit-hash "$TARGET_SHA" \
              --commit-message "foundation-recovery release-sha:$TARGET_SHA" \
              --commit-dirty=false

      - name: Verify raw Cloudflare deployment metadata
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          deployments_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments?env=production&per_page=100"
          pages_ok=false
          for attempt in $(seq 1 18); do
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$deployments_url" > recovery-evidence/pages-deployments-api.json
            if TARGET_SHA="$TARGET_SHA" jq -e '
              .success == true and any(.result[];
                .environment == "production" and
                .deployment_trigger.metadata.commit_hash == env.TARGET_SHA and
                .latest_stage.status == "success"
              )
            ' recovery-evidence/pages-deployments-api.json > /dev/null; then
              pages_ok=true
              break
            fi
            sleep 5
          done
          test "$pages_ok" = "true" || {
            echo "::error::Exact-SHA production Pages deployment was not visible through the Cloudflare API."
            jq -r '.result[]? | [.id, .environment, .deployment_trigger.metadata.branch, .deployment_trigger.metadata.commit_hash, .latest_stage.status] | @tsv' \
              recovery-evidence/pages-deployments-api.json || true
            exit 1
          }

          bunx wrangler versions list --name "$WORKER_NAME" --config "$WORKER_CONFIG" --json \
            > recovery-evidence/worker-versions.json
          bunx wrangler deployments status --name "$WORKER_NAME" --config "$WORKER_CONFIG" --json \
            > recovery-evidence/worker-deployment.json
          bunx wrangler secret list --name "$WORKER_NAME" --config "$WORKER_CONFIG" --format json \
            > recovery-evidence/worker-secrets.json

          bun scripts/verify-production-deployment.mjs \
            "$TARGET_SHA" \
            recovery-evidence/pages-deployments-api.json \
            recovery-evidence/worker-versions.json \
            recovery-evidence/worker-deployment.json \
            > recovery-evidence/deployment-verification.json

          bun -e '
            import { readFileSync } from "node:fs";
            const secrets = JSON.parse(readFileSync("recovery-evidence/worker-secrets.json", "utf8"));
            const names = new Set((Array.isArray(secrets) ? secrets : []).map((item) => item?.name));
            for (const name of ["INTERNAL_JOB_TOKEN", "TURNSTILE_SECRET_KEY"]) {
              if (!names.has(name)) throw new Error(`Missing Worker secret ${name}.`);
            }
          '

      - name: Run production smoke and read-only preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bun scripts/verify-production-smoke.mjs \
            | tee recovery-evidence/production-smoke.json

          bunx wrangler d1 list --json > recovery-evidence/d1-list.json
          bunx wrangler d1 info "$D1_DATABASE" --config "$WORKER_CONFIG" --json \
            > recovery-evidence/d1-info.json
          bunx wrangler d1 execute "$D1_DATABASE" --remote --config "$WORKER_CONFIG" --json \
            --command "select (select group_concat(name, '|') from (select name from d1_migrations order by name)) as applied_migrations, (select count(*) from pragma_index_list('contacts') where name = 'contacts_email_normalized_unique_idx' and \"unique\" = 1) as unique_index_count, (select count(*) from (select email_normalized from contacts where email_normalized is not null and trim(email_normalized) <> '' group by email_normalized having count(*) > 1)) as duplicate_email_group_count;" \
            > recovery-evidence/d1-state.json
          curl --fail-with-body --silent --show-error https://homeinstgeorgeutah.com/api/health \
            > recovery-evidence/api-health.json
          curl --fail-with-body --silent --show-error https://homeinstgeorgeutah.com/api/mls-status \
            > recovery-evidence/mls-status.json
          curl --fail-with-body --silent --show-error https://homeinstgeorgeutah.com/api/v1/session \
            > recovery-evidence/account-session.json

          bun scripts/verify-production-preflight.mjs \
            --config="$WORKER_CONFIG" \
            --d1List=recovery-evidence/d1-list.json \
            --d1Info=recovery-evidence/d1-info.json \
            --d1State=recovery-evidence/d1-state.json \
            --workerDeployment=recovery-evidence/worker-deployment.json \
            --workerSecrets=recovery-evidence/worker-secrets.json \
            --health=recovery-evidence/api-health.json \
            --mlsStatus=recovery-evidence/mls-status.json \
            --accountSession=recovery-evidence/account-session.json \
            | tee recovery-evidence/production-preflight.json

      - name: Record verified result on release issue
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment_id="$(TARGET_SHA="$TARGET_SHA" jq -r '.result[] | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == env.TARGET_SHA) | .id' recovery-evidence/pages-deployments-api.json | head -n1)"
          body="$(cat <<EOF
## Production foundation recovery verified

- Exact release SHA: \`$TARGET_SHA\`
- Pages project: \`$PAGES_PROJECT\`
- Production branch: \`$PRODUCTION_BRANCH\`
- Pages deployment ID: \`$deployment_id\`
- Worker: \`$WORKER_NAME\`
- Raw Cloudflare Pages API metadata: verified
- Exact Worker version and active deployment: verified
- Required Worker secret names: verified
- Production smoke tests: passed
- Read-only production preflight: passed
- IDX/VOW activation: unchanged and disabled
- Indexing activation: unchanged
- Recovery workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
EOF
)"
          jq -n --arg body "$body" '{body: $body}' > recovery-evidence/issue-comment.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @recovery-evidence/issue-comment.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/20/comments" \
            > recovery-evidence/issue-comment-response.json

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-foundation-recovery-${{ env.TARGET_SHA }}
          path: recovery-evidence
          if-no-files-found: error
          retention-days: 30
