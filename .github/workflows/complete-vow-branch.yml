name: Complete VOW branch

on:
  push:
    branches:
      - agent/vow-consumer-accounts

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/vow-consumer-accounts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Complete VOW implementation contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path_value}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "apps/api/src/services/vow-auth-service.ts",
              '''function base64UrlToBytes(value: string) {
            const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
            const padded = normalized.padEnd(Math.ceil(normalized.length / 4) * 4, "=");
            const binary = atob(padded);
            return Uint8Array.from(binary, (character) => character.charCodeAt(0));
          }

          ''',
              "",
          )

          replace_once(
              "apps/site/src/components/ConsumerAccountIsland.tsx",
              'import { useEffect, useMemo, useState } from "react";',
              'import { useCallback, useEffect, useMemo, useState } from "react";',
          )
          replace_once(
              "apps/site/src/components/ConsumerAccountIsland.tsx",
              "  async function load() {",
              "  const load = useCallback(async () => {",
          )
          replace_once(
              "apps/site/src/components/ConsumerAccountIsland.tsx",
              '''      setLoadState("error");
            }
          }

          useEffect(() => {
            load();
          }, []);''',
              '''      setLoadState("error");
            }
          }, []);

          useEffect(() => {
            load();
          }, [load]);''',
          )

          replace_once(
              "scripts/verify-production-smoke.mjs",
              "if (!scope || scope.active !== false) {",
              "if (scope?.active !== false) {",
          )
          replace_once(
              "scripts/verify-production-preflight.mjs",
              '  "VOW_STATE_SECRET",\n',
              '  "VOW_STATE_SECRET",\n  "VOW_TOKEN_ENCRYPTION_KEY",\n',
          )
          replace_once(
              "scripts/test-production-helpers.sh",
              '[{"name":"INTERNAL_JOB_TOKEN"},{"name":"TURNSTILE_SECRET_KEY"}]',
              '[{"name":"INTERNAL_JOB_TOKEN"},{"name":"TURNSTILE_SECRET_KEY"},{"name":"VOW_TOKEN_ENCRYPTION_KEY"}]',
          )
          replace_once(
              "scripts/audit-production-workflows.py",
              '    "TURNSTILE_SECRET_KEY",\n',
              '    "TURNSTILE_SECRET_KEY",\n    "VOW_TOKEN_ENCRYPTION_KEY",\n',
          )

          replace_once(
              "README.md",
              "The callback fails closed while approvals, production credentials, token exchange, and local-account linking remain incomplete.",
              "The VOW authorization start/callback, encrypted provider-token storage, first-party session, and owned saved-data boundary are implemented but fail closed while approvals, production endpoints, credentials, policy versions, and explicit activation remain incomplete.",
          )

          replace_once(
              "docs/operations/mls-activation-runbook.md",
              "Repeat independently for the other county. VOW activation has its own authorization and account-linking evidence and remains disabled until fully implemented and approved.",
              '''Repeat independently for the other county.

          ## VOW authorization and account path

          ```text
          active county VOW scope
            -> signed one-time OAuth state
            -> provider authorization and code exchange
            -> current-contact identity verification
            -> AES-GCM encrypted provider tokens in D1
            -> first-party HttpOnly/Secure/SameSite session
            -> county-scoped grants
            -> owned saved homes and saved searches
          ```

          Provider access and refresh tokens never enter browser storage, cookies, URL fragments, or API responses. The callback accepts only a valid signed, unexpired, unclaimed state record. Local sessions expose only the owned account identity and county grants.

          For one county at a time, VOW activation additionally requires:

          1. Approved authorization, token, and current-contact endpoints.
          2. Approved client ID and server-side client secret.
          3. `VOW_STATE_SECRET` and a distinct `VOW_TOKEN_ENCRYPTION_KEY` configured server-side.
          4. The exact registered callback URI verified with the provider.
          5. Controlled authorization, replay-rejection, token-encryption, identity-linking, logout, and saved-data tests.
          6. Confirmation that disabling the county scope blocks new authorization and all VOW-restricted display without affecting the other county.
          7. Broker and technical-owner approval recorded before the enable flag changes.

          The implementation is complete but remains fail-closed until those county-specific approvals, values, tests, and activation decisions are recorded.''',
          )

          release_path = Path("scripts/audit-release.py")
          release = release_path.read_text()
          replacements = [
              (
                  '    SITE_SRC / "pages" / "homes" / "search.astro",\n    SITE_SRC / "components" / "LeadFormIsland.tsx",',
                  '    SITE_SRC / "pages" / "homes" / "search.astro",\n    SITE_SRC / "pages" / "account" / "index.astro",\n    SITE_SRC / "components" / "LeadFormIsland.tsx",\n    SITE_SRC / "components" / "ConsumerAccountIsland.tsx",',
              ),
              (
                  '    ROOT / "apps" / "api" / "src" / "services" / "mls-scope-service.ts",\n    ROOT / "packages" / "db" / "migrations" / "0002_contact_integrity.sql",',
                  '    ROOT / "apps" / "api" / "src" / "services" / "mls-scope-service.ts",\n    ROOT / "apps" / "api" / "src" / "services" / "vow-auth-service.ts",\n    ROOT / "apps" / "api" / "src" / "services" / "consumer-account-service.ts",\n    ROOT / "packages" / "db" / "migrations" / "0002_contact_integrity.sql",',
              ),
              (
                  '    ROOT / "packages" / "db" / "migrations" / "0003_mls_scopes.sql",\n    ROOT / "THIRD_PARTY_FONT_LICENSES.md",',
                  '    ROOT / "packages" / "db" / "migrations" / "0003_mls_scopes.sql",\n    ROOT / "packages" / "db" / "migrations" / "0006_vow_consumer_accounts.sql",\n    ROOT / "THIRD_PARTY_FONT_LICENSES.md",',
              ),
              (
                  'if "/api/v1/leads/intake" not in lead_island:\n    errors.append("Lead form is not connected to /api/v1/leads/intake.")\n\nlisting_service =',
                  '''if "/api/v1/leads/intake" not in lead_island:
              errors.append("Lead form is not connected to /api/v1/leads/intake.")

          account_page = require(SITE_SRC / "pages" / "account" / "index.astro")
          account_island = require(SITE_SRC / "components" / "ConsumerAccountIsland.tsx")
          if "ConsumerAccountIsland" not in account_page or 'pathname="/account/"' not in account_page:
              errors.append("Consumer account route is not wired to the account island.")
          for control in [
              "/api/v1/session",
              "/api/mls-status",
              "/api/v1/saved-homes",
              "/api/v1/saved-searches",
              "/api/v1/auth/flexmls/start",
              "scope.active",
          ]:
              if control not in account_island:
                  errors.append(f"Consumer account UI is missing fail-closed control: {control}")

          listing_service =''',
              ),
              (
                  'if \'VOW_REDIRECT_URI = "https://homeinstgeorgeutah.com/api/v1/auth/flexmls/callback"\' not in wrangler:\n    errors.append("Registered production VOW callback is missing from Worker configuration.")\n',
                  '''if 'VOW_REDIRECT_URI = "https://homeinstgeorgeutah.com/api/v1/auth/flexmls/callback"' not in wrangler:
              errors.append("Registered production VOW callback is missing from Worker configuration.")
          for vow_configuration in [
              'WASHINGTON_VOW_CONTACT_URL = ""',
              'IRON_VOW_CONTACT_URL = ""',
              "VOW_TOKEN_ENCRYPTION_KEY",
          ]:
              if vow_configuration not in wrangler:
                  errors.append(f"VOW production configuration is missing: {vow_configuration}")
''',
              ),
              (
                  'if "/api/v1/auth/flexmls/callback" not in api_index or "VOW_AUTHORIZATION_PENDING" not in api_index:\n    errors.append("VOW callback boundary is missing or does not fail closed while pending.")\n',
                  '''for route in [
              "/api/v1/auth/flexmls/start",
              "/api/v1/auth/flexmls/callback",
              "/api/v1/session",
              "/api/v1/session/logout",
              "/api/v1/saved-homes",
              "/api/v1/saved-searches",
          ]:
              if route not in api_index:
                  errors.append(f"Consumer account API route is missing: {route}")
          if "VOW_AUTHORIZATION_PENDING" not in api_index:
              errors.append("VOW authorization does not fail closed while pending.")

          vow_auth_service = require(ROOT / "apps" / "api" / "src" / "services" / "vow-auth-service.ts")
          for control in [
              "AES-GCM",
              "__Host-hisgu_session",
              "HttpOnly",
              "Secure",
              "SameSite=Lax",
              "claimAttempt",
              "VOW_TOKEN_ENCRYPTION_KEY",
          ]:
              if control not in vow_auth_service:
                  errors.append(f"VOW authorization service is missing security control: {control}")
''',
              ),
              (
                  '    "homes/search/index.html",\n]',
                  '    "homes/search/index.html",\n    "account/index.html",\n]',
              ),
          ]
          for old, new in replacements:
              if old not in release:
                  raise SystemExit(f"Expected release-audit block not found: {old[:100]!r}")
              release = release.replace(old, new, 1)
          release_path.write_text(release)
          PY
      - name: Format modified TypeScript and JavaScript
        run: |
          bunx biome format --write \
            apps/api/src/services/vow-auth-service.ts \
            apps/site/src/components/ConsumerAccountIsland.tsx \
            scripts/verify-production-smoke.mjs \
            scripts/verify-production-preflight.mjs
      - name: Commit completion changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add \
            apps/api/src/services/vow-auth-service.ts \
            apps/site/src/components/ConsumerAccountIsland.tsx \
            scripts/verify-production-smoke.mjs \
            scripts/verify-production-preflight.mjs \
            scripts/test-production-helpers.sh \
            scripts/audit-production-workflows.py \
            scripts/audit-release.py \
            README.md \
            docs/operations/mls-activation-runbook.md
          git commit -m "Complete VOW release contract"
          git push origin HEAD:agent/vow-consumer-accounts
