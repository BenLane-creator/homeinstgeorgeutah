name: Release Audit Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PUBLIC_PRELAUNCH: "true"
      PUBLIC_SITE_URL: "https://homeinstgeorgeutah.com"
      PUBLIC_CONTACT_EMAIL: "joel@homeinstgeorgeutah.com"
      PUBLIC_CONTACT_PHONE: "(435) 773-1220"
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build:site
      - name: Capture release audit
        run: python3 scripts/audit-release.py > release-audit.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: release-audit-log
          path: release-audit.log
          retention-days: 1
      - name: Enforce release audit
        run: python3 scripts/audit-release.py
