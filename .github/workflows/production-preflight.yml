name: Production read-only preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-preflight.yml
      - scripts/verify-production-preflight.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-read-only-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify production readiness without changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      WORKER_CONFIG: apps/api/wrangler.toml
      WORKER_NAME: homeinstgeorgeutah-api
      D1_DATABASE: homeinstgeorgeutah

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify credentials and pinned Wrangler
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          bunx wrangler --version | grep -F "4.113.0"
          bunx wrangler whoami > /tmp/cloudflare-whoami.txt
          grep -Fq -- "$CLOUDFLARE_ACCOUNT_ID" /tmp/cloudflare-whoami.txt || {
            echo "::error::Cloudflare token is not authenticated to the production account."
            exit 1
          }

      - name: Collect read-only Cloudflare and live-route evidence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler d1 list --json > /tmp/d1-list.json
          bunx wrangler d1 info "$D1_DATABASE" --config "$WORKER_CONFIG" --json \
            > /tmp/d1-info.json
          bunx wrangler d1 execute "$D1_DATABASE" \
            --remote \
            --config "$WORKER_CONFIG" \
            --json \
            --command "select (select group_concat(name, '|') from (select name from d1_migrations order by name)) as applied_migrations, (select count(*) from pragma_index_list('contacts') where name = 'contacts_email_normalized_unique_idx' and \"unique\" = 1) as unique_index_count, (select count(*) from (select email_normalized from contacts where email_normalized is not null and trim(email_normalized) <> '' group by email_normalized having count(*) > 1)) as duplicate_email_group_count;" \
            > /tmp/d1-state.json
          bunx wrangler deployments status \
            --name "$WORKER_NAME" \
            --config "$WORKER_CONFIG" \
            --json > /tmp/worker-deployment.json
          bunx wrangler secret list \
            --name "$WORKER_NAME" \
            --config "$WORKER_CONFIG" \
            --format json > /tmp/worker-secrets.json
          curl --fail-with-body --silent --show-error \
            --retry 2 --connect-timeout 10 --max-time 30 \
            https://homeinstgeorgeutah.com/api/health > /tmp/api-health.json
          curl --fail-with-body --silent --show-error \
            --retry 2 --connect-timeout 10 --max-time 30 \
            https://homeinstgeorgeutah.com/api/mls-status > /tmp/mls-status.json
          curl --fail-with-body --silent --show-error \
            --retry 2 --connect-timeout 10 --max-time 30 \
            https://homeinstgeorgeutah.com/api/v1/session > /tmp/account-session.json

      - name: Verify production evidence
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bun scripts/verify-production-preflight.mjs \
            --config="$WORKER_CONFIG" \
            --d1List=/tmp/d1-list.json \
            --d1Info=/tmp/d1-info.json \
            --d1State=/tmp/d1-state.json \
            --workerDeployment=/tmp/worker-deployment.json \
            --workerSecrets=/tmp/worker-secrets.json \
            --health=/tmp/api-health.json \
            --mlsStatus=/tmp/mls-status.json \
            --accountSession=/tmp/account-session.json \
            | tee /tmp/production-preflight-result.json

      - name: Record read-only result
        shell: bash
        run: |
          {
            echo "### Production read-only preflight passed"
            echo
            echo "- Cloudflare account and D1 ownership verified"
            echo "- Production migration ledger and contact integrity verified"
            echo "- Worker deployment and approved secret-name inventory verified"
            echo "- Root-domain API route verified"
            echo "- Washington and Iron IDX/VOW scopes confirmed disabled"
            echo "- Consumer session confirmed anonymous without creating an account or authorization attempt"
            echo
            echo "No backup, migration apply, D1 write, Worker deploy, Pages deploy, route change, secret change, DNS change, form submission, account creation, authorization attempt, or MLS activation was performed."
          } >> "$GITHUB_STEP_SUMMARY"
