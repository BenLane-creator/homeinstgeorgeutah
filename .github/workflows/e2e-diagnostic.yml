name: E2E Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  county-search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUBLIC_PRELAUNCH: "true"
      PUBLIC_SITE_URL: "https://homeinstgeorgeutah.com"
      PUBLIC_CONTACT_EMAIL: "joel@homeinstgeorgeutah.com"
      PUBLIC_CONTACT_PHONE: "(435) 773-1220"
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build:site
      - run: bunx playwright install --with-deps chromium
      - name: Capture county-search journey
        run: bunx playwright test tests/e2e/home.spec.ts --grep "independent Washington and Iron" > e2e-diagnostic.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostic-log
          path: e2e-diagnostic.log
          retention-days: 1
      - name: Enforce county-search journey
        run: bunx playwright test tests/e2e/home.spec.ts --grep "independent Washington and Iron"
