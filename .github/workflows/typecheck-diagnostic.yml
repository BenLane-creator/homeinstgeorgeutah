name: Typecheck Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Capture typecheck
        run: |
          set +e
          bun --filter @home/api typecheck > typecheck.log 2>&1
          code=$?
          echo "$code" > typecheck.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostic
          path: |
            typecheck.log
            typecheck.exit
          retention-days: 1
      - name: Enforce typecheck
        run: test "$(cat typecheck.exit)" = "0"
