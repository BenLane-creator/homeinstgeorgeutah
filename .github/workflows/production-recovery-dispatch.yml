name: Dispatch production foundation recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-recovery-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch recovery on current main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch protected recovery workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Retrigger after semantic headline verification replaced raw HTML matching.
          jq -n --arg ref "main" '{ref: $ref}' > "$RUNNER_TEMP/recovery-dispatch.json"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @"$RUNNER_TEMP/recovery-dispatch.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-foundation-recovery.yml/dispatches" \
            --output /dev/null
