name: Production application rollback

on:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: Full 40-character prior commit SHA to redeploy for Pages
        required: true
        type: string
      worker_version_id:
        description: Exact prior Cloudflare Worker version ID
        required: true
        type: string
      pages_project:
        description: Exact Cloudflare Pages project name
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK APPLICATION WITHOUT D1 RESTORE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-foundation-release
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back Worker and Pages without mutating D1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      WORKER_CONFIG: apps/api/wrangler.toml
      WORKER_NAME: homeinstgeorgeutah-api
      D1_DATABASE: homeinstgeorgeutah
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
      PAGES_PROJECT: ${{ inputs.pages_project }}

    steps:
      - name: Check out exact rollback SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.rollback_sha }}
          fetch-depth: 0

      - name: Validate rollback request
        shell: bash
        env:
          ROLLBACK_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$ROLLBACK_CONFIRMATION" = "ROLLBACK APPLICATION WITHOUT D1 RESTORE" || {
            echo "::error::Confirmation phrase is incorrect."
            exit 1
          }
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::rollback_sha must be a full lowercase 40-character SHA."
            exit 1
          }
          [[ "$WORKER_VERSION_ID" =~ ^[0-9a-f-]{20,}$ ]] || {
            echo "::error::worker_version_id is not in the expected format."
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$ROLLBACK_SHA" || {
            echo "::error::Checked-out commit does not match rollback_sha."
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$ROLLBACK_SHA" origin/main || {
            echo "::error::rollback_sha is not contained in main."
            exit 1
          }
          mkdir -p rollback-evidence
          printf 'rollback_sha=%s\nworker_version_id=%s\npages_project=%s\nrequested_at=%s\nd1_restore=not_performed\n' \
            "$ROLLBACK_SHA" "$WORKER_VERSION_ID" "$PAGES_PROJECT" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > rollback-evidence/rollback-request.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and build rollback site
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build:site

      - name: Verify Cloudflare credentials and capture current state
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          bunx wrangler --version | grep -F "4.113.0"
          bunx wrangler whoami > rollback-evidence/cloudflare-whoami.txt
          grep -Fq -- "$CLOUDFLARE_ACCOUNT_ID" rollback-evidence/cloudflare-whoami.txt
          bunx wrangler versions list --name "$WORKER_NAME" --config "$WORKER_CONFIG" --json \
            > rollback-evidence/worker-versions-before.json
          grep -Fq -- "$WORKER_VERSION_ID" rollback-evidence/worker-versions-before.json || {
            echo "::error::Requested Worker version is not present in the current version inventory."
            exit 1
          }
          bunx wrangler deployments status --name "$WORKER_NAME" --config "$WORKER_CONFIG" --json \
            > rollback-evidence/worker-deployment-before.json
          bunx wrangler pages deployment list --project-name "$PAGES_PROJECT" --environment production --json \
            > rollback-evidence/pages-deployments-before.json
          bunx wrangler d1 time-travel info "$D1_DATABASE" --config "$WORKER_CONFIG" --json \
            > rollback-evidence/d1-bookmark-before.json

      - name: Roll back Worker and redeploy prior Pages SHA
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WRANGLER_OUTPUT_FILE_PATH=rollback-evidence/worker-rollback.ndjson \
            bunx wrangler rollback "$WORKER_VERSION_ID" \
              --name "$WORKER_NAME" \
              --config "$WORKER_CONFIG" \
              --message "rollback-sha:$ROLLBACK_SHA worker-version:$WORKER_VERSION_ID"
          WRANGLER_OUTPUT_FILE_PATH=rollback-evidence/pages-rollback.ndjson \
            bunx wrangler pages deploy apps/site/dist \
              --project-name "$PAGES_PROJECT" \
              --commit-hash "$ROLLBACK_SHA" \
              --commit-message "rollback-sha:$ROLLBACK_SHA" \
              --commit-dirty=false

      - name: Verify rollback metadata and live routes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler versions list --name "$WORKER_NAME" --config "$WORKER_CONFIG" --json \
            > rollback-evidence/worker-versions-after.json
          bunx wrangler deployments status --name "$WORKER_NAME" --config "$WORKER_CONFIG" --json \
            > rollback-evidence/worker-deployment-after.json
          bunx wrangler pages deployment list --project-name "$PAGES_PROJECT" --environment production --json \
            > rollback-evidence/pages-deployments-after.json
          grep -Fq -- "$WORKER_VERSION_ID" rollback-evidence/worker-deployment-after.json || {
            echo "::error::Requested Worker version is not active after rollback."
            exit 1
          }
          ROLLBACK_SHA="$ROLLBACK_SHA" bun -e '
            import { readFileSync } from "node:fs";
            const payload = JSON.parse(readFileSync("rollback-evidence/pages-deployments-after.json", "utf8"));
            const text = JSON.stringify(payload);
            if (!text.includes(process.env.ROLLBACK_SHA)) {
              throw new Error(`Pages production deployment is not attached to ${process.env.ROLLBACK_SHA}.`);
            }
          '
          bun scripts/verify-production-smoke.mjs | tee rollback-evidence/production-smoke.json

      - name: Write rollback summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Production application rollback"
            echo ""
            echo "- Pages rollback SHA: \`$ROLLBACK_SHA\`"
            echo "- Worker version: \`$WORKER_VERSION_ID\`"
            echo "- D1 restore: not performed"
            echo "- Evidence artifact: \`production-rollback-$ROLLBACK_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-rollback-${{ inputs.rollback_sha }}
          path: rollback-evidence
          if-no-files-found: error
          retention-days: 30
