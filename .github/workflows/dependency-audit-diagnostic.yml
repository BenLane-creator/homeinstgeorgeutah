name: Dependency Audit Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Resolve patched dependencies
        run: bun install
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Lockfile is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Refresh lockfile for patched dependencies"
          git push origin HEAD:${{ github.head_ref }}
      - name: Capture audit report
        run: |
          bun audit --json > dependency-audit.json || true
          test -s dependency-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: dependency-audit.json
          retention-days: 1
      - name: Enforce high-severity gate
        run: bun audit --audit-level=high
      - name: Build authenticated app on patched packages
        id: app-build
        run: bun --filter @home/app build > app-build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authenticated-app-build-log
          path: app-build.log
          if-no-files-found: ignore
          retention-days: 1
