name: Dependency Audit Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Capture audit report
        run: |
          bun audit --json > dependency-audit.json || true
          test -s dependency-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: dependency-audit.json
          retention-days: 1
      - name: Enforce high-severity gate
        run: bun audit --audit-level=high
